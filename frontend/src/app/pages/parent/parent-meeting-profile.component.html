<section class="panel">
  <h2>{{ 'meetingProfile.title' | translate }}</h2>
  <p class="muted">{{ 'meetingProfile.intro' | translate }}</p>

  <label class="field">
    <span>{{ 'meetingProfile.studentEmail' | translate }}</span>
    <input [(ngModel)]="studentSchoolEmail" type="email" autocomplete="email" placeholder="student@school.edu" />
  </label>

  <label class="field">
    <span>{{ 'meetingProfile.attendeeName' | translate }}</span>
    <input [(ngModel)]="interviewAttendeeName" autocomplete="name" placeholder="Full legal name" />
  </label>

  <label class="field">
    <span>{{ 'meetingProfile.relationship' | translate }}</span>
    <input [(ngModel)]="relationshipToStudent" placeholder="e.g. Mother, Father, Legal guardian" />
  </label>

  <button type="button" class="btn" (click)="save()">{{ 'meetingProfile.save' | translate }}</button>
  <a *ngIf="showSkipToApp" routerLink="/app/parent" class="muted">{{ 'meetingProfile.back' | translate }}</a>

  <p class="status" *ngIf="status">{{ status }}</p>
</section>
