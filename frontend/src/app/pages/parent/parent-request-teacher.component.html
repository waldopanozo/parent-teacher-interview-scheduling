<section class="panel">
  <p class="back"><a routerLink="/app/parent">{{ 'meetingProfile.back' | translate }}</a></p>

  <h2>{{ 'requestTeacher.title' | translate }}</h2>
  <p class="muted">{{ 'requestTeacher.intro' | translate }}</p>

  <label class="field">
    <span>{{ 'requestTeacher.message' | translate }}</span>
    <textarea [(ngModel)]="message" placeholder="Subjects or grades you expect to teach, etc."></textarea>
  </label>

  <button type="button" class="btn" (click)="submit()">{{ 'requestTeacher.submit' | translate }}</button>

  <p class="status" *ngIf="status">{{ status }}</p>
</section>
