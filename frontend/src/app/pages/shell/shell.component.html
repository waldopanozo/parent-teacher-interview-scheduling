<div class="shell">
  <header class="top">
    <div class="brand">{{ 'shell.brand' | translate }}</div>
    <nav class="nav">
      <a *ngIf="auth.profile()?.role === 0" routerLink="/app/parent" routerLinkActive="active">{{
        'shell.nav.parent' | translate
      }}</a>
      <a *ngIf="auth.profile()?.role === 1" routerLink="/app/teacher" routerLinkActive="active">{{
        'shell.nav.teacher' | translate
      }}</a>
      <a *ngIf="auth.profile()?.role === 2" routerLink="/app/director" routerLinkActive="active">{{
        'shell.nav.director' | translate
      }}</a>
    </nav>
    <div class="user">
      <span class="name">{{ auth.profile()?.displayName }}</span>
      <button type="button" class="link" (click)="auth.logout()">{{ 'shell.signOut' | translate }}</button>
    </div>
  </header>

  <main class="main">
    <router-outlet />
  </main>
</div>
