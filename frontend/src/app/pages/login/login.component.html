<div class="auth-page">
  <div class="auth-card" [class.auth-card--register]="isRegisterMode">
    <!-- Promo panel (blue): left in login mode, right in register mode -->
    <aside class="auth-promo" aria-label="Switch form">
      <ng-container *ngIf="!isRegisterMode">
        <h2 class="auth-promo__title">Hello, Welcome!</h2>
        <p class="auth-promo__text">Don't have an account?</p>
        <button type="button" class="btn-outline" (click)="setMode(true)">Register</button>
      </ng-container>
      <ng-container *ngIf="isRegisterMode">
        <h2 class="auth-promo__title">Welcome Back!</h2>
        <p class="auth-promo__text">Already have an account?</p>
        <button type="button" class="btn-outline" (click)="setMode(false)">Login</button>
      </ng-container>
    </aside>

    <!-- Form panel (white) -->
    <div class="auth-forms">
      <ng-container *ngIf="!isRegisterMode">
        <h1 class="auth-forms__heading">Login</h1>
        <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="submitLogin()" novalidate>
          <label class="field">
            <span class="field__label">Username</span>
            <span class="field__control">
              <input
                type="email"
                formControlName="email"
                class="field__input"
                placeholder="Email"
                autocomplete="username"
              />
              <span class="field__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                  />
                </svg>
              </span>
            </span>
          </label>
          <label class="field">
            <span class="field__label">Password</span>
            <span class="field__control">
              <input
                type="password"
                formControlName="password"
                class="field__input"
                placeholder="Password"
                autocomplete="current-password"
              />
              <span class="field__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path
                    d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"
                  />
                </svg>
              </span>
            </span>
          </label>
          <a href="#" class="link-forgot" (click)="forgotPasswordClick($event)">Forgot password?</a>
          <button type="submit" class="btn-primary">Login</button>
        </form>
      </ng-container>

      <ng-container *ngIf="isRegisterMode">
        <h1 class="auth-forms__heading">Registration</h1>
        <form class="auth-form" [formGroup]="registerForm" (ngSubmit)="submitRegister()" novalidate>
          <label class="field">
            <span class="field__label">Username</span>
            <span class="field__control">
              <input
                type="text"
                formControlName="username"
                class="field__input"
                placeholder="Username"
                autocomplete="name"
              />
              <span class="field__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path
                    d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                  />
                </svg>
              </span>
            </span>
          </label>
          <label class="field">
            <span class="field__label">Email</span>
            <span class="field__control">
              <input
                type="email"
                formControlName="email"
                class="field__input"
                placeholder="Email"
                autocomplete="email"
              />
              <span class="field__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path
                    d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
                  />
                </svg>
              </span>
            </span>
          </label>
          <label class="field">
            <span class="field__label">Password</span>
            <span class="field__control">
              <input
                type="password"
                formControlName="password"
                class="field__input"
                placeholder="Password"
                autocomplete="new-password"
              />
              <span class="field__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                  <path
                    d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"
                  />
                </svg>
              </span>
            </span>
          </label>
          <button type="submit" class="btn-primary">Register</button>
        </form>
      </ng-container>

      <p class="social-lead">or continue with Google</p>
      <div class="social-row">
        <div #googleButton class="google-host"></div>
      </div>

      <p class="hint hint--error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="hint hint--info" *ngIf="infoMessage && !errorMessage">{{ infoMessage }}</p>
    </div>
  </div>
</div>
