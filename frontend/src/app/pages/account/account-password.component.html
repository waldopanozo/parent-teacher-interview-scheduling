<div class="account-password">
  <header class="page-header">
    <h1 class="page-title">{{ 'accountPassword.title' | translate }}</h1>
    <p class="page-sub muted">{{ 'accountPassword.intro' | translate }}</p>
  </header>

  <div class="card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <label class="field">
        <span>{{ 'accountPassword.current' | translate }}</span>
        <input type="password" formControlName="currentPassword" autocomplete="current-password" />
      </label>
      <label class="field">
        <span>{{ 'accountPassword.new' | translate }}</span>
        <input type="password" formControlName="newPassword" autocomplete="new-password" />
      </label>
      <label class="field">
        <span>{{ 'accountPassword.confirm' | translate }}</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      </label>
      <button type="submit" class="btn">{{ 'accountPassword.save' | translate }}</button>
    </form>
    <p class="ok" *ngIf="success">{{ 'accountPassword.success' | translate }}</p>
    <p class="err" *ngIf="status">{{ status }}</p>
  </div>
</div>
