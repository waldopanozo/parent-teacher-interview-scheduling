services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pta_interviews
    ports:
      - "5544:5432"
    volumes:
      - pta_interviews_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pta_interviews"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/InterviewScheduling.Api
      dockerfile: Dockerfile
      # Linux: use host network during build so NuGet/npm TLS matches the host (avoids bridge/MTU/DNS TLS quirks).
      network: host
    environment:
      # Default Development (demo user seed, OpenAPI). Override via .env: ASPNETCORE_ENVIRONMENT=Production
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=db;Port=5432;Database=pta_interviews;Username=postgres;Password=postgres
      Jwt__Issuer: pta-interview-scheduling
      Jwt__Audience: pta-interview-scheduling-clients
      Jwt__SigningKey: docker-dev-only-signing-key-min-32-chars!
      Jwt__AccessTokenMinutes: "120"
      Google__WebClientId: ${GOOGLE_OAUTH_CLIENT_ID:-}
      Auth__AllowedEmailDomains: ${ALLOWED_EMAIL_DOMAINS:-}
      Auth__AllowPersonalGoogleEmails: ${ALLOW_PERSONAL_GOOGLE_EMAILS:-true}
      Auth__TeacherBootstrapEmails: ${TEACHER_BOOTSTRAP_EMAILS:-}
      Auth__DirectorBootstrapEmails: ${DIRECTOR_BOOTSTRAP_EMAILS:-}
      Scheduling__SchoolTimeZoneId: America/New_York
      Cors__AllowedOrigins__0: http://localhost:3456
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5103:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        GOOGLE_WEB_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    ports:
      - "3456:80"
    depends_on:
      - api

volumes:
  pta_interviews_pg:
